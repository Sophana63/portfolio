<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Définition d'un pétale de cerisier avec son échancrure -->
    <path id="petal" d="M0,0 C-15,-20 -20,-35 -5,-45 Q0,-40 0,-40 Q0,-40 5,-45 C20,-35 15,-20 0,0 Z" 
          fill="#ffb3c6" 
          stroke="#ff8fab" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
  </defs>
  
  <!-- Centrage de la fleur et rotation des 5 pétales -->
  <g transform="translate(50, 50)">
    <use href="#petal" />
    <use href="#petal" transform="rotate(72)" />
    <use href="#petal" transform="rotate(144)" />
    <use href="#petal" transform="rotate(216)" />
    <use href="#petal" transform="rotate(288)" />
    
    <!-- Cœur de la fleur -->
    <circle cx="0" cy="0" r="5" fill="#ff4d6d"/>
  </g>
</svg>
